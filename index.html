<style>
/* Layout: one record per pile (palo), sections mirroring the SCQ_PALO_02
   QC sheet order; repeatable concrete-delivery rows; a touch signature pad */
:root{
  --bg:#eae7df;
  --surface:#ffffff;
  --surface-2:#f3f1ea;
  --fg:#1c1f1a;
  --muted:#6c6f63;
  --border:#d4d0c3;
  --accent:#d4530f;
  --accent-fg:#fff8f3;
  --good:#2f6b3f;
  --danger:#a83232;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15161a;
    --surface:#1e2024;
    --surface-2:#25272c;
    --fg:#eceae4;
    --muted:#9a9d93;
    --border:#33363b;
    --accent:#f0783a;
    --accent-fg:#1c1200;
    --good:#6fbf7f;
    --danger:#e08080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a;
  --surface:#1e2024;
  --surface-2:#25272c;
  --fg:#eceae4;
  --muted:#9a9d93;
  --border:#33363b;
  --accent:#f0783a;
  --accent-fg:#1c1200;
  --good:#6fbf7f;
  --danger:#e08080;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'Archivo',system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  z-index:20;
  background:var(--surface-2);
}
.gutter{
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:'Archivo',system-ui,sans-serif;margin:0;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,select{font-family:inherit}

/* ---- top bar ---- */
header.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
  background:var(--surface-2);border-bottom:1px solid var(--border);
}
header.topbar .inner{
  padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header.topbar h1{font-size:18px;font-weight:800;letter-spacing:-0.01em}
header.topbar .count{font-size:12px;color:var(--muted)}
.icon-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--fg);
  border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex:none;
}

main{padding-block:16px 100px;min-height:100%}

/* ---- empty state ---- */
.empty{margin-top:14vh;text-align:center;color:var(--muted)}
.empty .mark{
  width:52px;height:52px;margin:0 auto 14px;border:2px solid var(--border);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.empty h2{font-size:16px;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:260px;margin:0 auto;line-height:1.5}

/* ---- record cards ---- */
.card-list{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.card .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .palo-name{font-size:16px;font-weight:800}
.card .polo-name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .date{font-size:12px;color:var(--muted)}
.badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.badge.ok{background:rgba(47,107,63,.14);color:var(--good)}
.badge.warn{background:rgba(168,50,50,.14);color:var(--danger)}
.card .stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px;
  border-top:1px dashed var(--border);
}
.stat{min-width:0}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:14px;font-weight:600}
.card .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--fg);border-radius:9px;
  padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;min-width:0;
}
.btn:active{opacity:.75}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- fab ---- */
.fab{
  position:fixed;right:max(18px, calc(env(safe-area-inset-right,0px) + 14px));
  bottom:max(18px, calc(env(safe-area-inset-bottom,0px) + 14px));z-index:18;
  background:var(--accent);color:var(--accent-fg);border:none;border-radius:999px;
  width:58px;height:58px;font-size:28px;font-weight:600;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.35);cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.fab:active{transform:scale(.95)}

/* ---- form overlay ---- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.overlay .formhead{
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface-2);
  border-bottom:1px solid var(--border);padding-block:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2;
}
.overlay .formhead h2{font-size:16px}
.overlay .formbody{overflow-y:auto;padding-block:16px 120px;flex:1}
.section{margin-bottom:22px}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-title .line{flex:1;height:1px;background:var(--border)}
.section-note{
  font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.5;
}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input, .field select{
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;padding:10px 11px;
  border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--fg);
  width:100%;min-width:0;
}
.field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field .unit{font-size:11px;color:var(--muted);margin-top:1px}

.conform-row{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;
}
.conform-row .ctitle{font-size:12.5px;font-weight:700;margin-bottom:8px}
.conform-row .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.delivery-row{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;
}
.delivery-row .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.delivery-row .dhead .tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.delivery-row .remove{border:none;background:transparent;color:var(--danger);font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.add-row{
  width:100%;border:1.5px dashed var(--border);background:transparent;color:var(--accent);
  border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;
}
.summary-bar{
  display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:4px;
  font-size:12.5px;color:var(--muted);
}
.summary-bar b{color:var(--fg)}
.diff-warn{color:var(--danger)}
.diff-ok{color:var(--good)}

.sig-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.sig-wrap canvas{
  width:100%;height:150px;display:block;border-radius:9px;border:1px dashed var(--border);
  background:#fff;touch-action:none;
}
.sig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.overlay .formfoot{
  position:fixed;left:0;right:0;bottom:0;padding-bottom:max(14px, env(safe-area-inset-bottom,0px));
  padding-top:12px;background:var(--surface-2);border-top:1px solid var(--border);display:flex;gap:10px;z-index:3;
}
.overlay .formfoot .btn{flex:1;justify-content:center;padding-block:12px;font-size:14px}

.toast{
  position:fixed;left:50%;bottom:max(90px, calc(env(safe-area-inset-bottom,0px) + 80px));
  transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1}

@media (min-width:640px){
  .gutter{max-width:640px;margin-inline:auto;padding-left:16px;padding-right:16px}
  header.topbar .inner, .overlay .formhead, .overlay .formbody, .overlay .formfoot{max-width:640px;margin-inline:auto}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner gutter">
    <h1>Scheda Palo</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="count mono" id="countLabel">0 pali</span>
      <button class="icon-btn" id="btnGiornaliera" aria-label="Scheda giornaliera" title="Scheda giornaliera">📅</button>
      <button class="icon-btn" id="btnSettings" aria-label="Impostazioni cantiere">⚙</button>
    </div>
  </div>
</header>

<main class="gutter">
  <div id="app"></div>
</main>

<button class="fab" id="fabNew" aria-label="Nuovo palo">+</button>

<div id="overlayRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>

<script>
(function(){
  "use strict";
var STORAGE_KEY = "cantiere_pali_v2";
  var DEFAULTS_KEY = "cantiere_pali_defaults_v1";
  var SIGNATURE_KEY = "cantiere_pali_firma_default_v1";
  var GIORN_COUNTER_KEY = "cantiere_pali_giorn_counter_v1";

  function peekNextSchedaN(){
    var c = parseInt(loadStr(GIORN_COUNTER_KEY)||"0", 10);
    if(isNaN(c)) c = 0;
    return c+1;
  }
  function bumpGiornCounter(usedValue){
    var used = parseInt(usedValue, 10);
    saveStr(GIORN_COUNTER_KEY, String(isNaN(used) ? peekNextSchedaN() : used));
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function loadJSON(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  function loadStr(key){
    try{ return localStorage.getItem(key) || ""; }catch(e){ return ""; }
  }
  function saveStr(key, val){
    try{ localStorage.setItem(key, val); }catch(e){}
  }

  var DEFAULT_SETTINGS = {
    disegnoRiferimento: "DCER20201C27904_04",
    attrezzaturaPerforazione: "Comacchio CH-450",
    lunghezzaGabbia: "10.95",
    ferriDiam: "16",
    spiraleDiam: "8",
    spiralePasso: "10"
  };

  var records = loadJSON(STORAGE_KEY, []);
  var settings = Object.assign({}, DEFAULT_SETTINGS, loadJSON(DEFAULTS_KEY, {}));

  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateIt(iso){
    if(!iso) return "—";
    var p = iso.split("-");
    return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0]) : iso;
  }
  function n(v, dec){
    if(v===""||v===null||v===undefined||isNaN(v)) return "—";
    return Number(v).toFixed(dec===undefined?1:dec).replace(/\.0+$/,"").replace(/(\.\d*[1-9])0+$/,"$1");
  }
  function esc(s){
    return String(s===undefined||s===null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];

  // Se dopo il salvataggio ci sono più di MAX_PALI_ATTIVI pali, elimina il più vecchio
  // GIÀ esportato in PDF, per liberare spazio senza mai perdere dati non ancora esportati.
  // Non tocca mai il palo appena salvato. Ritorna il palo eliminato (o null).
  function pruneOldExportedIfOverLimit(justSavedId){
    if(records.length <= MAX_PALI_ATTIVI) return null;
    var candidates = records
      .filter(function(r){ return r.id !== justSavedId && r.exportatoPdf; })
      .sort(function(a,b){ return a.createdAt - b.createdAt; });
    if(candidates.length === 0) return null;
    var toRemove = candidates[0];
    records = records.filter(function(r){ return r.id !== toRemove.id; });
    saveJSON(STORAGE_KEY, records);
    return toRemove;
  }

  function drawSignatureFromDataUrl(dataUrl){
    if(!sigCtx) return;
    sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);
    if(!dataUrl) return;
    var img = new Image();
    img.onload = function(){
      sigCtx.drawImage(img, 0, 0, sigCanvas.width, sigCanvas.height);
    };
    img.src = dataUrl;
  }

  function setupSignaturePad(rec){
    sigCanvas = document.getElementById("sigCanvas");
    if(!sigCanvas) return;
    var ratio = window.devicePixelRatio || 1;
    var rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = Math.max(300, rect.width) * ratio;
    sigCanvas.height = 150 * ratio;
    sigCtx = sigCanvas.getContext("2d");
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 2.2;
    sigCtx.lineCap = "round";
    sigCtx.strokeStyle = "#1c1f1a";

    if(rec.firma) drawSignatureFromDataUrl(rec.firma);

    function posFromEvent(e){
      var r = sigCanvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function pointerDown(e){
      sigDrawing = true;
      sigLastPt = posFromEvent(e);
      sigCanvas.setPointerCapture && sigCanvas.setPointerCapture(e.pointerId);
    }
    function pointerMove(e){
      if(!sigDrawing) return;
      var p = posFromEvent(e);
      sigCtx.beginPath();
      sigCtx.moveTo(sigLastPt.x, sigLastPt.y);
      sigCtx.lineTo(p.x, p.y);
      sigCtx.stroke();
      sigLastPt = p;
    }
    function pointerUp(){
      if(!sigDrawing) return;
      sigDrawing = false;
      try{ rec.firma = sigCanvas.toDataURL("image/png"); }catch(e){}
    }
    sigCanvas.onpointerdown = pointerDown;
    sigCanvas.onpointermove = pointerMove;
    sigCanvas.onpointerup = pointerUp;
    sigCanvas.onpointerleave = pointerUp;
  }

    function bind(){
      document.getElementById("btnCancel").onclick = closeOverlay;

      overlayRoot.querySelectorAll('[data-field]').forEach(function(inp){
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function(){
          var field = inp.getAttribute("data-field");
          var key = inp.getAttribute("data-key");
          if(key){
            var g = rec.getti.find(function(x){ return x.key===key; });
            if(g) g[field] = inp.value;
            if(field==="volume") document.getElementById("totalsBox").innerHTML = totalsHtml();
          } else {
            rec[field] = inp.value;
            if(field==="calcestruzzoTeorico") document.getElementById("totalsBox").innerHTML = totalsHtml();
          }
        });
      });

      overlayRoot.querySelectorAll('[data-removedelivery]').forEach(function(btn){
        btn.onclick = function(){
          var key = btn.getAttribute("data-removedelivery");
          rec.getti = rec.getti.filter(function(g){ return g.key!==key; });
          overlayRoot.innerHTML = fullHtml();
          bind();
        };
      });

      document.getElementById("btnAddDelivery").onclick = function(){
        rec.getti.push(newDelivery());
        overlayRoot.innerHTML = fullHtml();
        bind();
        var rows = overlayRoot.querySelectorAll(".delivery-row");
        var last = rows[rows.length-1];
        if(last){
          var firstInput = last.querySelector("input");
          if(firstInput) firstInput.focus();
          last.scrollIntoView({block:"center", behavior:"smooth"});
        }
      };

      setupSignaturePad(rec);
      document.getElementById("btnSigClear").onclick = function(){
        rec.firma = "";
        drawSignatureFromDataUrl("");
      };
      document.getElementById("btnSigUseDefault").onclick = function(){
        var def = loadStr(SIGNATURE_KEY);
        if(!def){ showToast("Nessuna firma del giorno salvata"); return; }
        rec.firma = def;
        drawSignatureFromDataUrl(def);
      };
      document.getElementById("btnSigSetDefault").onclick = function(){
        if(!rec.firma){ showToast("Firma prima nel riquadro"); return; }
        saveStr(SIGNATURE_KEY, rec.firma);
        showToast("Firma del giorno aggiornata");
      };

      var delBtn = document.getElementById("btnDelete");
      if(delBtn){
        delBtn.onclick = function(){
          records = records.filter(function(r){ return r.id!==rec.id; });
          saveJSON(STORAGE_KEY, records);
          closeOverlay();
          renderList();
          showToast("Palo eliminato");
        };
      }

      document.getElementById("btnSave").onclick = function(){
        if(!rec.palo || !rec.palo.trim()){
          showToast("Inserisci il numero del palo");
          document.getElementById("f-palo").focus();
          return;
        }
        rec.getti = rec.getti.filter(function(g){ return g.ddt && g.ddt.trim(); });
        if(rec.getti.length===0) rec.getti = [newDelivery()];

        var idx = records.findIndex(function(r){ return r.id===rec.id; });
        if(idx>=0){ records[idx] = rec; } else { records.push(rec); }
        saveJSON(STORAGE_KEY, records);

        var removed = pruneOldExportedIfOverLimit(rec.id);

        closeOverlay();
        renderList();
        if(removed){
          showToast("Palo salvato. Palo "+(removed.palo||removed.id)+" (già esportato) rimosso per liberare spazio.");
        } else if(records.length > MAX_PALI_ATTIVI){
          showToast("Palo salvato. Hai superato i "+MAX_PALI_ATTIVI+" pali: esporta il PDF di qualche palo vecchio per liberare spazio.");
        } else {
          showToast("Palo salvato");
        }
      };
    }
    bind();
  }

  // ---------------- PDF EXPORT: scrive direttamente sul modulo ufficiale SCQ_PALO_02 ----------------
  var PAGE_H = 842.04; // A4 in punti, come nel template originale
  function topY(pdfLibPage, topdownY){ return PAGE_H - topdownY; }

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function wrapText(str, maxCharsPerLine){
    var words = String(str).split(/\s+/);
    var lines = []; var cur = "";
    words.forEach(function(w){
      if((cur+" "+w).trim().length > maxCharsPerLine){
        if(cur) lines.push(cur.trim());
        cur = w;
      } else {
        cur = (cur+" "+w).trim();
      }
    });
    if(cur) lines.push(cur.trim());
    return lines;
  }
  function itNum(v){
    if(v===""||v===null||v===undefined||isNaN(v)) return "";
    return String(v).replace(".", ",");
  }

  async function exportPdf(recordId){
    var rec = records.find(function(r){ return r.id===recordId; });
    if(!rec){ return; }
    if(!window.PDFLib){
      showToast("Libreria PDF non disponibile");
      return;
    }
    try{
      var PDFDocument = window.PDFLib.PDFDocument;
      var StandardFonts = window.PDFLib.StandardFonts;
      var rgb = window.PDFLib.rgb;

      var pdfDoc = await PDFDocument.load(b64ToBytes(TEMPLATE_PDF_B64));
      var page = pdfDoc.getPages()[0];
      var font = await pdfDoc.embedFont(StandardFonts.Helvetica);
      var fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      var WHITE = rgb(1,1,1), BLACK = rgb(0,0,0), RED = rgb(0.75,0.1,0.1);

      function fitToWidth(str, size, useFont, maxWidth){
        var s = String(str);
        if(useFont.widthOfTextAtSize(s, size) <= maxWidth) return s;
        while(s.length > 1 && useFont.widthOfTextAtSize(s+"…", size) > maxWidth){
          s = s.slice(0, -1);
        }
        return s + "…";
      }
      function text(str, x, top, opts){
        opts = opts || {};
        if(str===undefined||str===null||str==="") return;
        var size = opts.size || 9;
        var useFont = opts.bold ? fontBold : font;
        var str2 = opts.maxWidth ? fitToWidth(str, size, useFont, opts.maxWidth) : String(str);
        page.drawText(str2, {
          x: x, y: topY(page, top),
          size: size,
          font: useFont,
          color: opts.color || BLACK
        });
      }
      function whiteout(x0, top0, x1, top1){
        page.drawRectangle({ x: x0, y: topY(page, top1), width: x1-x0, height: top1-top0, color: WHITE });
      }
      function circle(cx, cyTop, rx, ry){
        page.drawEllipse({ x: cx, y: topY(page, cyTop), xScale: rx, yScale: ry, borderColor: RED, borderWidth: 1.3 });
      }

      // WBS / Palo N° / Polo N°
      text(rec.palo, 104, 175.5, {size:10, maxWidth: 75});
      text(rec.polo, 218, 175.5, {size:10, maxWidth: 283});

      // Disegno di riferimento / Attrezzatura (sovrascrive i default del template se diversi)
      whiteout(150, 183, 480, 196);
      text(rec.disegnoRiferimento, 151, 193.9, {size:9.5, maxWidth: 395});
      whiteout(198, 202, 480, 214);
      text(rec.attrezzaturaPerforazione, 199, 212.2, {size:9.5, maxWidth: 347});

      // Tabella sinistra: dati perforazione/getto
      text(fmtDateIt(rec.dataPerforazione), 190, 231, {size:9.5});
      whiteout(186, 243, 292, 257);
      if(rec.diametroPalo) text(n(rec.diametroPalo,0)+"mm", 190, 252, {size:9.5});
      if(rec.lunghezzaPerforazione) text(itNum(n(rec.lunghezzaPerforazione,2))+"m", 190, 272.5, {size:9.5});
      text(fmtDateIt(rec.dataGetto), 190, 293.5, {size:9.5});
      whiteout(186, 305, 292, 319.5);
      if(rec.calcestruzzoTeorico) text(itNum(n(rec.calcestruzzoTeorico,2)), 190, 318.5, {size:9.5});

      // Tabella destra: Rivestimento, Palo strumentato e Presenza acqua sono
      // sempre "NO" per questo cantiere: si cerchia sempre NO, a prescindere
      // dal valore salvato nel record (anche per schede create in precedenza).
      circle(528.4, 224.5, 10, 8);
      circle(528.4, 245.5, 10, 8);
      circle(439.6, 268.2, 10, 8);
      text(rec.idPrelievo, 388, 309, {size:9, maxWidth: 163});
      text(rec.noteBox, 362, 330, {size:8.5, maxWidth: 188});

      // Verifica dimensione acciai
      if(rec.tipoGabbia){
        whiteout(175.6, 561.1, 220.1, 585.6);
        wrapText(rec.tipoGabbia, 16).slice(0,2).forEach(function(ln, i){
          text(ln, 178, 571 + i*8, {size:6.2});
        });
      }

      whiteout(139, 595, 174, 609);
      if(rec.lunghezzaGabbia) text(itNum(rec.lunghezzaGabbia), 141, 606, {size:9});
      if(rec.lunghezzaGabbiaConforme==="C") circle(197.85, 592.3, 19, 7);
      if(rec.lunghezzaGabbiaConforme==="NC") circle(197.85, 607.6, 21, 9.5);

      whiteout(139, 627, 174, 641);
      if(rec.ferriDiam) text(n(rec.ferriDiam,0), 141, 638, {size:9});
      if(rec.ferriConforme==="C") circle(197.85, 624.2, 19, 7);
      if(rec.ferriConforme==="NC") circle(197.85, 640.9, 21, 9.5);

      whiteout(129, 660, 174, 674);
      text("Ø"+(rec.anelliDiam?n(rec.anelliDiam,0):"__")+"  n."+(rec.anelliNum?n(rec.anelliNum,0):"__"), 131, 671, {size:8.5});
      if(rec.anelliConforme==="C") circle(197.85, 657.6, 19, 7);
      if(rec.anelliConforme==="NC") circle(197.85, 675.0, 21, 9.5);

      whiteout(90, 693, 100, 708);
      if(rec.spiraleDiam) text(n(rec.spiraleDiam,0), 91, 705, {size:9});
      whiteout(142, 693, 174, 708);
      if(rec.spiralePasso) text(n(rec.spiralePasso,0), 144, 705, {size:9});
      if(rec.spiraleConforme==="C") circle(197.85, 691.0, 19, 7);
      if(rec.spiraleConforme==="NC") circle(197.85, 707.7, 21, 9.5);

      // Riepilogo dati getto: il modulo ha 7 righe disponibili
      var rowBands = [
        [599.0,616.1],[616.5,631.9],[632.4,649.4],
        [649.9,665.3],[665.7,682.9],[683.4,698.6],[699.1,716.3]
      ];
      var cols = { ddt:241, m3:306, oi:343, of:380, slump:415, temp:490 };
      rec.getti.slice(0,7).forEach(function(g, i){
        var bottomY = rowBands[i][1] - 5.5;
        text(g.ddt, cols.ddt, bottomY, {size:8.5, maxWidth: 58});
        text(n(g.volume,2), cols.m3, bottomY, {size:8.5, maxWidth: 30});
        text(g.oraInizio, cols.oi, bottomY, {size:8.5, maxWidth: 34});
        text(g.oraFine, cols.of, bottomY, {size:8.5, maxWidth: 32});
        text(n(g.slump,1), cols.slump, bottomY, {size:8.5, maxWidth: 58});
        text(n(g.temperatura,1), cols.temp, bottomY, {size:8.5, maxWidth: 38});
      });
      if(rec.getti.length > 7){
        text("+"+(rec.getti.length-7)+" ulteriori consegne non riportate per spazio (vedi app)", 237, 722, {size:7, color: RED});
      }

      // Note aggiuntive
      text(rec.noteAggiuntive, 125, 745.5, {size:8.5, maxWidth: 400});

      // Firma "Per l'Impresa"
      if(rec.firma){
        try{
          var sigImg = await pdfDoc.embedPng(rec.firma);
          var dims = sigImg.scale(1);
          var w = 110, h = w * (dims.height / dims.width);
          page.drawImage(sigImg, { x: 108, y: topY(page, 795), width: w, height: h });
        }catch(e){}
      }

      var pdfBytes = await pdfDoc.save();
      var blob = new Blob([pdfBytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "palo_"+(rec.palo||rec.id)+"_"+rec.dataGetto+".pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

      rec.exportatoPdf = true;
      saveJSON(STORAGE_KEY, records);
      renderList();
    }catch(e){
      console.error(e);
      showToast("Esportazione non riuscita");
    }
  }

  // ---------------- PDF EXPORT: Scheda Pali Giornaliera (riepilogo fino a 11 pali/pagina) ----------------
  var PAGE_H_G = 612.0; // Letter orizzontale, come nel template
  var COLS_G = [281.3, 324.8, 368.4, 412.0, 455.5, 499.1, 542.6, 586.2, 629.8, 673.3, 716.9, 760.0];

  async function exportGiornaliera(dataGiorno, schedaN, firmaDataUrl, piles){
    if(!window.PDFLib){
      showToast("Libreria PDF non disponibile");
      return false;
    }
    try{
      var PDFDocument = window.PDFLib.PDFDocument;
      var StandardFonts = window.PDFLib.StandardFonts;
      var rgb = window.PDFLib.rgb;
      var BLACK = rgb(0,0,0);

      var docRif = "";
      for(var k=0;k<piles.length;k++){ if(piles[k].disegnoRiferimento){ docRif = piles[k].disegnoRiferimento; break; } }
      var dataLabel = fmtDateIt(dataGiorno);

      var chunks = [];
      for(var i=0;i<piles.length;i+=11){ chunks.push(piles.slice(i, i+11)); }
      if(chunks.length===0) chunks.push([]);

      var finalDoc = await PDFDocument.create();

      for(var ci=0; ci<chunks.length; ci++){
        var srcDoc = await PDFDocument.load(b64ToBytes(TEMPLATE_GIORNALIERA_B64));
        var page = srcDoc.getPages()[0];
        var font = await srcDoc.embedFont(StandardFonts.Helvetica);
        var fontBold = await srcDoc.embedFont(StandardFonts.HelveticaBold);

        (function(page, font, fontBold, chunkPiles){
          function Yg(top){ return PAGE_H_G - top; }
          function colCenter(idx){ return (COLS_G[idx]+COLS_G[idx+1])/2; }
          function txt(str, x, top, opts){
            opts = opts || {};
            if(str===undefined||str===null||str==="") return;
            var size = opts.size || 8.5;
            var useFont = opts.bold ? fontBold : font;
            var s = String(str);
            if(opts.maxWidth){
              while(s.length>1 && useFont.widthOfTextAtSize(s, size) > opts.maxWidth){ s = s.slice(0,-1); }
            }
            var drawX = x;
            if(opts.center !== undefined){
              var w = useFont.widthOfTextAtSize(s, size);
              drawX = opts.center - w/2;
            }
            page.drawText(s, { x: drawX, y: Yg(top) - size*0.35, size: size, font: useFont, color: opts.color || BLACK });
          }

          txt(schedaN, 727, 81.6, {size:9.5, maxWidth: 30});
          txt(dataLabel, 70, 139.2, {size:9.5});
          txt(docRif, 520, 139.2, {size:8.5, maxWidth: 235});

          var ROW = {
            pHeader: 171.5, profondita:186.5, diametro:204.2, verticalita:221.8,
            conservazione:292.4, sovrapp:310.0, quotaFinaleGabbia:327.6, spessoreCopriferro:345.3,
            slump:380.6, idPrelievo:398.2, betoniera1:415.8, betoniera2:433.5, volumeCls:451.1
          };

          chunkPiles.forEach(function(p, idx){
            var cx = colCenter(idx);
            txt(p.palo, COLS_G[idx]+9, ROW.pHeader, {size:9, bold:true, maxWidth: 30});
            if(p.lunghezzaPerforazione) txt(itNum(n(p.lunghezzaPerforazione,2)), null, ROW.profondita, {size:8.5, center: cx});
            if(p.diametroPalo) txt(n(parseFloat(p.diametroPalo)/10, 0), null, ROW.diametro, {size:8.5, center: cx});
            txt("OK", null, ROW.verticalita, {size:8.5, center: cx});
            txt("OK", null, ROW.conservazione, {size:8.5, center: cx});
            txt("N.A.", null, ROW.sovrapp, {size:8, center: cx});
            if(p.quotaFinaleGabbia) txt(itNum(n(p.quotaFinaleGabbia,2)), null, ROW.quotaFinaleGabbia, {size:8, center: cx});
            txt("10 cm", null, ROW.spessoreCopriferro, {size:8, center: cx});
            if(p.slumpGiornaliera) txt(itNum(n(p.slumpGiornaliera,1)), null, ROW.slump, {size:8.5, center: cx});
            if(p.idPrelievo) txt(p.idPrelievo, null, ROW.idPrelievo, {size:7.2, center: cx, maxWidth: 40});
            var g1 = p.getti && p.getti[0], g2 = p.getti && p.getti[1];
            if(g1 && g1.ddt) txt(g1.ddt, null, ROW.betoniera1, {size:8, center: cx, maxWidth: 40});
            if(g2 && g2.ddt) txt(g2.ddt, null, ROW.betoniera2, {size:8, center: cx, maxWidth: 40});
            var totVol = (p.getti||[]).reduce(function(s,gg){ return s+(parseFloat(gg.volume)||0); }, 0);
            if(totVol>0) txt(itNum(n(totVol,2)), null, ROW.volumeCls, {size:8.5, center: cx});
            // Quota fine getto: sempre lasciata in bianco (dato non ancora disponibile per questo cantiere)
          });
        })(page, font, fontBold, chunks[ci]);

        if(ci===0 && firmaDataUrl){
          try{
            var sigImg = await srcDoc.embedPng(firmaDataUrl);
            var dims = sigImg.scale(1);
            var ratio = dims.height / dims.width;
            var maxH = 22, maxW = 190;
            var w = maxW, h = w*ratio;
            if(h > maxH){ h = maxH; w = h/ratio; }
            var bottomTopdown = 506; // centrata nel riquadro VEICOPAL, a destra della scritta "VEICOPAL"
            page.drawImage(sigImg, { x: 90, y: PAGE_H_G - bottomTopdown, width: w, height: h });
          }catch(e){}
        }

        var copied = await finalDoc.copyPages(srcDoc, [0]);
        finalDoc.addPage(copied[0]);
      }

      var pdfBytes = await finalDoc.save();
      var blob = new Blob([pdfBytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "scheda_giornaliera_"+dataGiorno+"_n"+schedaN+".pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){
      console.error(e);
      showToast("Esportazione giornaliera non riuscita");
      return false;
    }
  }

  appEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn) return;
    var act = btn.getAttribute("data-act");
    var id = btn.getAttribute("data-id");
    if(act==="edit") renderForm(id);
    if(act==="pdf") exportPdf(id);
  });

  document.getElementById("fabNew").onclick = function(){ renderForm(null); };
  document.getElementById("btnSettings").onclick = renderSettings;
  document.getElementById("btnGiornaliera").onclick = renderGiornaliera;

  renderList();
})();
</script>
</body>
</html>
